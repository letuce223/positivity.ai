<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="face-api.min.js"></script>
  <script defer src="script.js"></script>
  <style>
    body {
      margin: 0;
    }

    img {
      width: 100%;
      display: block;
    }

    @font-face {
      font-family: text;
      src: url(Coolvetica\ Rg.otf);
    }

    marquee {
      font-family: text;
      font-size: 36pt;
    }

    #rec {
  position: absolute;
  top: 35px;
  right: 135px;
  width: 25px;
  height: 25px;
  background: red;
  border-radius: 50%;
  z-index: 1000;
  animation: blink 1s infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
  </style>
</head>

<body>
  <div style="position:relative">
    <img src="news.jpg">

    <div id="rec"></div>

    <marquee scrollamount="15" style="position:absolute; top:11.3%; width:100%; color:white;">
      Poland and Lithuania preparing cross-border evacuation plan for Baltic states
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:39.9%; width:100%; color:white;">
      Economic toll of Iran war 'unbearable', Qatar warns
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:51.6%; width:100%; color:#ff2e3c;">
      Hurricane Polo brings powerful waves to Mexico's Pacific coast
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:83.8%; width:100%; color:black;">
      US lays groundwork for possible military action in Cuba
    </marquee>
    </div>

  <video id="video" width="720" height="560" autoplay muted playsinline
    style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none"></video>

  <div id="popup"><div id="yt"></div></div>

</body>

</html>
