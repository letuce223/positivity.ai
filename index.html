<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.js"></script>
  <!--<script defer src="script.js"></script>-->
  <style>
    body {
      margin: 0;
    }

    img {
      width: 100%;
      display: block;
    }

    @font-face {
      font-family: text;
      src: url(Coolvetica\ Rg.otf);
    }

    marquee {
      font-family: text;
      font-size: 16pt;
    }

    #rec {
  position: absolute;
  top: 35px;
  right: 135px;
  width: 25px;
  height: 25px;
  background: red;
  border-radius: 50%;
  z-index: 1000;
  animation: blink 1s infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
    #popup { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:999; background:black; opacity:0; pointer-events:none; }
    #popup.show { opacity:1; pointer-events:auto; }
  </style>
</head>

<body>
  <div style="position:relative">
    <img src="news.jpg">

    <div id="rec"></div>

    <marquee scrollamount="15" style="position:absolute; top:13%; width:100%; color:white;">
      Poland and Lithuania preparing cross-border evacuation plan for Baltic states
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:35%; width:100%; color:white;">
      Economic toll of Iran war 'unbearable', Qatar warns
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:50%; width:100%; color:#ff2e3c;">
      Hurricane Polo brings powerful waves to Mexico's Pacific coast
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:80%; width:100%; color:black;">
      US lays groundwork for possible military action in Cuba
    </marquee>
    </div>

  <video id="video" autoplay muted playsinline
    style="position:fixed; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.01; z-index:-1; pointer-events:none"></video>

  <video id="popup" src="popup.mp4" loop muted playsinline preload="auto"></video>

  <div id="debug" style="display:none;position:fixed;top:0;left:0;z-index:2000;background:yellow;font:16px monospace;padding:4px"></div>
</body>

</html>
