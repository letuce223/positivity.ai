<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="face-api.min.js"></script>
  <script defer src="script.js"></script>
  <style>
    body {
      margin: 0;
    }

    img {
      width: 100%;
      display: block;
    }

    @font-face {
      font-family: text;
      src: url(Coolvetica\ Rg.otf);
    }

    marquee {
      font-family: text;
      font-size: 36pt;
    }

    #rec {
  position: absolute;
  top: 35px;
  right: 135px;
  width: 25px;
  height: 25px;
  background: red;
  border-radius: 50%;
  z-index: 1000;
  animation: blink 1s infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
  </style>
</head>

<body>
  <div style="position:relative">
    <img src="news.jpg">

    <div id="rec"></div>

    <marquee scrollamount="15" style="position:absolute; top:11.3%; width:100%; color:white;">
      Poland and Lithuania preparing cross-border evacuation plan for Baltic states
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:39.9%; width:100%; color:white;">
      Economic toll of Iran war 'unbearable', Qatar warns
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:51.6%; width:100%; color:#ff2e3c;">
      Hurricane Polo brings powerful waves to Mexico's Pacific coast
    </marquee>

    <marquee scrollamount="15" style="position:absolute; top:83.8%; width:100%; color:black;">
      US lays groundwork for possible military action in Cuba
    </marquee>
  </div>
 <iframe
  src="https://www.youtube.com/embed/wdyxvfMKhI4?autoplay=1&mute=1&loop=1&playlist=wdyxvfMKhI4&controls=0&rel=0&playsinline=1"
  width="1280" height="720"
  frameborder="0"
  allow="autoplay; encrypted-media"
  allowfullscreen>
</iframe>

  <video id="popup" src="popup edit.mp4" loop muted playsinline
    style="display:none; position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:999"></video>

</body>

</html>
